name: release-candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or intended release tag (required only when publish=true)"
        required: false
        type: string
      publish:
        description: "Publish a draft GitHub Release after all validation jobs pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml

  backend:
    uses: ./.github/workflows/backend.yml

  publish:
    name: Explicitly approved draft release
    if: inputs.publish
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit tag and matching project version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          version=$(sed -n 's/^project(ttyd VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          normalized_tag=${RELEASE_TAG#v}
          test "$normalized_tag" = "$version"
      - uses: actions/download-artifact@v4
        with:
          name: ttyd.x86_64
          path: build
      - name: Create checksums
        run: sha256sum build/ttyd > build/SHA256SUMS
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          artifacts: "build/ttyd,build/SHA256SUMS"
          allowUpdates: false
          draft: true
