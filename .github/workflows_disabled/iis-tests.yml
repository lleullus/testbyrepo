name: IIS tests

on:
  push:
    branches:
      - snapshot/iis-skills

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run IIS unittest suite
        shell: bash
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: Run privileged host conformance
        shell: bash
        run: |
          set -o pipefail
          sudo env PYTHONPATH="$GITHUB_WORKSPACE" python3 -B tests/run_host_conformance.py 2>&1 | tee host-conformance.log
      - name: Run Observatory unittest suite
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/observatory/src:$GITHUB_WORKSPACE" python3 -B -m unittest discover -s observatory/tests -v 2>&1 | tee observatory-unittest.log
      - name: Preserve unittest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iis-unittest-log
          path: |
            unittest.log
            host-conformance.log
            observatory-unittest.log
