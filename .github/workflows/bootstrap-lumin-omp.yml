name: Bootstrap Lumin Repo Lens OMP port

on:
  push:
    branches:
      - snapshot/lumin-repo-lens-omp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: snapshot/lumin-repo-lens-omp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
      - name: Generate and verify the OMP-native port
        run: bash .github/bootstrap-lumin-omp.sh
      - name: Commit generated port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: port lumin-repo-lens to OMP"
          git push origin HEAD:snapshot/lumin-repo-lens-omp
