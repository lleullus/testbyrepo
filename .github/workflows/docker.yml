name: docker-build-only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amd64:
    name: Manual amd64 image validation (no push)
    runs-on: ubuntu-24.04
    env:
      BUILD_TARGET: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable build roots
        run: |
          echo "CROSS_ROOT=$RUNNER_TEMP/ttyd-cross" >> "$GITHUB_ENV"
          echo "STAGE_ROOT=$RUNNER_TEMP/ttyd-stage" >> "$GITHUB_ENV"
          echo "BUILD_ROOT=$RUNNER_TEMP/ttyd-build" >> "$GITHUB_ENV"
          echo "DOWNLOAD_ROOT=$RUNNER_TEMP/ttyd-downloads" >> "$GITHUB_ENV"
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool
      - name: Build checksum-pinned amd64 binary
        run: ./scripts/cross-build.sh
      - name: Prepare Docker build context
        run: |
          mkdir -p dist/amd64
          cp "$STAGE_ROOT/x86_64-linux-musl/bin/ttyd" dist/amd64/ttyd
          sha256sum dist/amd64/ttyd
      - uses: docker/setup-buildx-action@v3
      - name: Validate Ubuntu image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: local/ttyd-ci:ubuntu
      - name: Validate Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64
          push: false
          tags: local/ttyd-ci:alpine
