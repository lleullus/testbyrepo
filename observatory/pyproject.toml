[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iis-observatory"
version = "0.2.1"
description = "Read-only portfolio overview and current-state scanner for IIS planning artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "IIS" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
iis-observatory = "iis_observatory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
