interface:
  display_name: "Ready Ticket Implement"
  short_description: "Implement one Ready Ticket from current independent method review"
  default_prompt: "Use $ready-ticket-implement with one SUBAGENT worker by default, or current Main only when I explicitly select DIRECT for this stage. Preserve my current model choice and exact Ticket authority. Pass the exact plan_review_path to the actual implementing actor; that actor must call ready_contract check_plan_admission before the first source mutation and again immediately before COMPLETE. Use host-native read/edit/test/build/lint/CLI, treat settled nonzero as an ordinary command failure, and fix/retry normally. For an actual non-idempotent/external effect response loss, do not blind replay; use approved authoritative readback/cleanup/evidence and return PARTIAL/BLOCKED if settlement cannot be established. If root cause/owner/interface/persistence/readback/effect strategy materially changes, stop dependent mutation, return terminal PARTIAL/BLOCKED, revise the affected Plan -> current independent review, and start a fresh actor only after old-worker settlement. Leave Ticket ready and never assume final verification authority or silently fall back between modes."
