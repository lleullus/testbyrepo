interface:
  display_name: "Production Heuristic Probing"
  short_description: "Find minimal counterexamples at actual assigned boundaries"
  default_prompt: "Use $production-heuristic-probing for the exact bound lane or standalone request. Read original promises and actual target, record short testable hypotheses before explanatory narrative or peer results, then exercise minimal safe discriminating triggers. Preserve raw readback, invocation/target/mechanism identity, usable reproducer and bounded same-assumption siblings, effects and authoritative settlement. Report COUNTEREXAMPLE_FOUND, NO_COUNTEREXAMPLE_WITHIN_BUDGET or UNOBSERVABLE separately from COMPLETE/PARTIAL/BLOCKED. Never approve the whole Scope, repair stable targets or record completion."
