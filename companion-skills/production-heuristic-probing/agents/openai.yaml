interface:
  display_name: "Production Heuristic Probing"
  short_description: "Probe real service behavior for minimal triggers and hidden boundary failures"
  default_prompt: "Use $production-heuristic-probing for one bounded production-heuristic investigation. On the normal IIS completion path, start only after a settled independent VERIFIED result and read the exact Thesis/Scope, actual implementation paths and unchanged verifier primary evidence. Prefer the smallest discriminating abnormal trigger and cross adjacent boundaries only from concrete clues. When a material finding uses a one-off script or command, preserve exact reusable content, initial state, failing authoritative readback, target/mechanism identity, effect and cleanup rather than only a temporary path; inspect directly connected same-assumption siblings. On a valid correction follow-up, begin with the predecessor trigger, corrected assumption, direct siblings and changed observation gap, then expand when a new material clue or invalid prior basis requires it. Do not issue an Acceptance verdict, rewrite product/planning sources or Scope status, or mutate stable/non-disposable production state. Return PRODUCTION HEURISTIC PROBE RESULT with attributable actions/evidence, reproducer handoff, currentness, cleanup, findings and limitations."
