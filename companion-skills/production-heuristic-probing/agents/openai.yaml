interface:
  display_name: "Production Heuristic Probing"
  short_description: "Probe real service behavior for minimal triggers and hidden boundary failures"
  default_prompt: "Use $production-heuristic-probing for one bounded production-heuristic investigation. On the normal IIS completion path, start only after a settled independent VERIFIED result and read the exact Thesis/Scope, actual implementation paths and unchanged verifier primary evidence. Prefer the smallest discriminating abnormal trigger and cross UI/auth/cache/network/modality/state boundaries only from concrete clues. Do not issue an Acceptance verdict, rewrite product/planning sources or Scope status, or mutate stable/non-disposable production state. Distinguish Scope-material findings from out-of-scope defects, preserve unavailable evidence as a limitation, stop when the bounded frontier is resolved, and return PRODUCTION HEURISTIC PROBE RESULT."
