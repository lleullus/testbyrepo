interface:
  display_name: "Scope Verify"
  short_description: "Independently verify every Scope Acceptance obligation"
  default_prompt: "Use $scope-verify for one exact Scope with one independent invocation separate from the implementer and Main. Read all bound originals and the actual correction/reproducer evidence when applicable; record source and target identities, declared scenario effects, execution mechanism, actual actions/readbacks, currentness and settlement. Adjudicate every authored Acceptance scenario and applicable product success condition. For a corrected target, execute the predecessor discriminator and directly affected boundaries first, then independently decide which prior primary observations remain applicable; issue one fresh whole-Scope verdict without mechanically replaying unaffected evidence. A still-running verifier may correct only a no-effect or settled invocation-local command/selector usage error under unchanged target, mechanism, assertion and observation boundary, preserving both attempts. Return the complete SCOPE VERIFICATION RESULT with original verdict and primary evidence. Do not remediate, delegate, dispatch the Production Heuristic Probe or write Scope status."
