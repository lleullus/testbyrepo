interface:
  display_name: "Scope Verify"
  short_description: "Independently verify every Scope Acceptance obligation"
  default_prompt: "Use $scope-verify for one exact Scope with one independent invocation separate from the implementer and Main. Read all bound originals; use ordinary tools to record source and target identities, declared scenario effects, actual actions/readbacks, currentness and settlement. Adjudicate every authored Acceptance scenario and applicable product success condition. Return the complete SCOPE VERIFICATION RESULT with original verdict and primary evidence. Do not remediate, delegate, dispatch Coverage or write Scope status. Main separately obtains read-only Coverage and records completion only after its required attribution/currentness checks; no patched host or special credential is required."
