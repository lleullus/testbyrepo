interface:
  display_name: "Ready Ticket Verify"
  short_description: "Verify every Ready Ticket obligation with integrated discovery"
  default_prompt: "Use $ready-ticket-verify by dispatching exactly one SUBAGENT verifier; DIRECT verification is unsupported and capability failure does not fall back to current Main. Preserve the selected verifier model. Resolve exact stable implementation targets and scenario-effect paths, then capture an immutable outside-root verification binding with ready_contract before any product/runtime scenario action; plan_review_path is optional navigation only. Semantically check every authored flow/AC, derive a bounded false-completion frontier, obtain fresh discriminating verifier-owned evidence, and use host-native inspection/CLI/service tools without remediating product source. Treat settled nonzero as ordinary evidence; for actual non-idempotent/external response loss, never blind replay and use authored authoritative readback/cleanup, returning INCONCLUSIVE when settlement cannot be established. After fixing one terminal semantic verdict, return one exact successful READY TICKET VERIFICATION RESULT with readable binding identity, verdict, and PENDING CALLER FINALIZATION; do not seal a verdict record, write done, or call ready_finalize. OMP validates and privately persists that exact terminal, then gives Parent an opaque terminal_handle. Parent passively receives it and calls ready_finalize with exactly that handle and no caller verdict/binding fields. Never extract, serialize, copy, edit, or recreate finalization authority. Keep semantic verdict, progression basis/result, and actual status distinct."
