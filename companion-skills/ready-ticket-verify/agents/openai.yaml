interface:
  display_name: "Ready Ticket Verify"
  short_description: "Verify every Ready obligation, then review Coverage before completion"
  default_prompt: "Use $ready-ticket-verify by dispatching exactly one SUBAGENT verifier per semantic cycle; DIRECT verification is unsupported and capability failure does not fall back to current Main. Preserve the selected verifier model. Resolve exact stable implementation targets and scenario-effect paths, then capture an immutable outside-root verification binding with ready_contract before product/runtime scenario action; plan_review_path is optional navigation only. Semantically check every authored flow/AC, ground each scenario's discrimination in actual implementation, resolve known material counterexamples from current evidence, and use host-native inspection/CLI/service tools without remediating product source. The separate additional path search belongs to post-success Coverage, not another verifier frontier pass. Treat settled nonzero as ordinary evidence; for actual non-idempotent/external response loss use authorized readback/cleanup rather than blind replay. The verifier returns one exact host-profile terminal and never delegates or finalizes. The finalization-owning caller obtains one read-only $ready-ticket-coverage result after VERIFIED from ready; only COMPLETE with no unresolved material gaps permits submitting that exact original host handle to ready_finalize. FAILED/INCONCLUSIVE keep non-progressing finalization without Coverage. Do not duplicate Coverage under Adaptive, reinterpret its findings as AC verdicts, reconstruct opaque authority, or resume an ended verifier; required supplementary adjudication uses a fresh invocation."
