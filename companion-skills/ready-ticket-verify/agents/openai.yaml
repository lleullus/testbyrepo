interface:
  display_name: "Ready Ticket Verify"
  short_description: "Verify every Ready Ticket obligation with integrated discovery"
  default_prompt: "Use $ready-ticket-verify with exactly one SUBAGENT verifier by default, or current Main only when I explicitly select DIRECT for this stage. Preserve current selected models and never silently switch modes. Resolve exact stable implementation targets and scenario-effect paths, then capture an immutable outside-root verification binding with ready_contract before any product/runtime scenario action; plan_review_path is optional navigation only. Semantically check every authored flow/AC, derive a bounded false-completion frontier, obtain fresh discriminating verifier-owned evidence, and use host-native inspection/CLI/service tools without remediating product source. Treat settled nonzero as ordinary evidence; for actual non-idempotent/external response loss, never blind replay and use authored authoritative readback/cleanup, returning INCONCLUSIVE when settlement cannot be established. After fixing the one terminal semantic verdict, call ready_contract seal_verdict for the exact binding/verdict and return both binding and immutable verdict-record path/SHA with PENDING CALLER FINALIZATION; the verifier never writes done or calls ready_finalize. In SUBAGENT the Parent passively receives the terminal result and calls ready_finalize with only the exact verdict-record path/SHA; DIRECT performs the same semantic-result/seal-then-finalization sequence. Keep verdict, progression basis/result and actual status distinct."
