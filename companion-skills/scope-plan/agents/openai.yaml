  short_description: "Prepare and independently review one IIS Scope method"
  default_prompt: "Use $scope-plan for one exact ready Scope. Read every bound Thesis source and the Scope directly, preserve product meaning and user-selected modes/models, write only the grounded Plan, and obtain a separate independent Plan Review. Return SCOPE PLAN RESULT with the exact outside-root iis-scope-plan-review/v2 artifact, reviewed source paths and actual-byte hashes, findings, limits and conditional start scope. Use ordinary tools; do not change Thesis or Scope, implement product source, or issue a verification verdict."
