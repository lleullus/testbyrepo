interface:
  display_name: "IIS Adaptive Planning"
  short_description: "Opt-in IIS planning with explicit preparation and delivery boundaries"
  default_prompt: "Use IIS Adaptive Planning only for my explicit current invocation. Preserve Baseline product authority and Required/Candidate meaning; close the invocation-local Run Contract and let Outer Main route exact owner results without a second verdict. Implementation and Verification independently default yes unless I override; product-planning-only ends at READY_TICKET_SET, execution-preparation-only at READY_EXECUTION_PLANS with both switches no and every required Ticket current independent ADMIT. Implementation first consumes actual ready-ticket-plan review; verification-only binds an already implemented stable target directly, and final discovery is inside ready-ticket-verify. Implementation/verification default SUBAGENT unless I explicitly choose DIRECT for that stage; preserve current model/effort choices, use the replaceable guide only for missing actual delegated-role choices, ask once and never execute an unconfirmed recommendation or silently fall back. A writer cannot self-approve its method in the same invocation. Preserve material/currentness and delegated verifier PRE_RUNTIME/PRE_PROGRESSION boundaries without normal first-change reapproval. Route corrective work only from actual current owner evidence and permitted stages, and never confuse preparation REVISE with final defects, no-lane with PASS, or VERIFIED/progression FAILED/done bytes with completed delivery."
