interface:
  display_name: "IIS Adaptive Planning"
  short_description: "Opt-in IIS planning with explicit preparation and delivery boundaries"
  default_prompt: "Use IIS Adaptive Planning only for my explicit current invocation. Preserve Baseline product authority and Required/Candidate meaning; close the invocation-local Run Contract and let Outer Main route exact owner results without a second verdict. Implementation and Verification independently default yes unless I override; product-planning-only ends at READY_TICKET_SET, execution-preparation-only at READY_EXECUTION_PLANS with both switches no and every required Ticket current independent ADMIT. Pass the actual ready-ticket-plan review to the implementing actor; that actor owns stateless start/end admission and host-native work. A material implementation method change is terminal PARTIAL/BLOCKED, so refresh affected Plan -> Heuristic -> independent review and start a fresh actor only after the prior invocation has ended. Verification-only uses the already implemented stable target directly; ready-ticket-verify captures its immutable binding, fixes one terminal semantic verdict, seals that verdict into an immutable record, and never writes done. After passive terminal fan-in, Outer Main calls ready_finalize with only the exact verifier-owned verdict-record path/SHA; it never supplies or recreates the semantic verdict. Implementation/verification default SUBAGENT unless I explicitly choose DIRECT for that stage; preserve current model/effort choices, use the replaceable guide only for missing actual delegated-role choices, ask once and never execute an unconfirmed recommendation or silently fall back. A writer cannot self-approve its method in the same invocation. Route corrective work only from actual current owner evidence and permitted stages, and never confuse preparation REVISE with final defects, no-lane with PASS, or VERIFIED/progression FAILED/already-done bytes with completed delivery."
