interface:
  display_name: "IIS Adaptive Planning"
  short_description: "Opt-in IIS planning with explicit preparation and delivery boundaries"
  default_prompt: "Use IIS Adaptive Planning only for my explicit current invocation. Preserve Baseline product authority and Required/Candidate meaning; close the invocation-local Run Contract and let Outer Main route exact owner results without a second verdict. Implementation and Verification independently default yes unless I override; product-planning-only ends at READY_TICKET_SET, execution-preparation-only at READY_EXECUTION_PLANS with both switches no and every required Ticket current independent ADMIT. Pass the actual ready-ticket-plan review to the implementing actor; that actor owns stateless start/end admission and host-native work. A material implementation method change is terminal PARTIAL/BLOCKED, so revise the affected Plan -> current independent review and start a fresh actor only after the prior invocation has ended. Verification-only uses the already implemented stable target directly; ready-ticket-verify is always exactly one SUBAGENT, captures its immutable binding, fixes one terminal semantic verdict, and never writes done. After passive terminal fan-in, VERIFIED from ready requires Outer Main to dispatch one independent read-only ready-ticket-coverage worker with the exact authority/report/primary evidence and target identity, not the opaque handle. Only COMPLETE with no unresolved material gaps permits submitting the associated original host handle to ready_finalize. Coverage failure or material findings withhold success without changing VERIFIED; route to existing owners and use a fresh verifier for supplementary adjudication. FAILED/INCONCLUSIVE keep non-progressing finalization without Coverage. Outer Main alone owns this sequence, with no duplicate top-level wrapper; it never supplies, copies, serializes, or recreates verdict authority. Implementation defaults SUBAGENT unless I explicitly choose DIRECT for that stage; verification has no DIRECT mode. Preserve current model/effort choices, including applicable Verification selection reuse for Coverage and any explicit scoped override, use the replaceable guide only for missing actual delegated-role choices, ask once, and never execute an unconfirmed recommendation or silently fall back. Preparation model selection applies only to actual Planner/Plan Review invocations; lead fan-in is writer-side continuation. A writer cannot self-approve its method in the same invocation. Route corrective work only from exact current owner returns and permitted stages, require a material changed input before redispatching the same owner, and never confuse preparation REVISE with final defects, no-lane with PASS, or VERIFIED/progression FAILED/already-done bytes with completed delivery."
