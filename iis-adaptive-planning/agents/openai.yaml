interface:
  display_name: "IIS Adaptive Planning"
  short_description: "Opt-in IIS planning with explicit run completion and correction"
  default_prompt: "Use IIS Adaptive Planning explicitly through one current invocation: preserve Baseline IIS authority, close the invocation-local Adaptive Run Contract and let Outer Main carry it without taking over planning, implementation, or verification authority, keep Required Named Items distinct from Candidate Named Items, apply Implementation and Verification independently with both yes by default unless I override either stage, use SUBAGENT by default for implementation, heuristic probing and verification unless I explicitly select DIRECT for the relevant stage, preserve each stage-specific override without changing the others or silently falling back, preserve my supplied model/effort selections and use the Run Contract's replaceable model guide plus current available configurations to recommend and ask me to confirm only missing enabled SUBAGENT selections together before closure, keep recommendations unselected until I confirm and carry confirmed choices across this invocation without automatic substitution or repeated per-Ticket questions, keep Main as Probe Lead with dynamic lane workers, have Outer Main return bounded CONTINUE | STEER | STOP decisions for implementation/verifier checkpoints without issuing a second implementation/verifier judgment, wait for terminal owner results before routing or triage, use CURRENT_INCREMENT_DELIVERED by default when I do not assign a narrower stop or broader outcome, ask only for any unresolved material field, use authority-based corrective re-entry unless I request fail-and-report, and never treat a planning-owner STOP, checkpoint, one implementation result, one Ticket, or one Increment as whole-run completion unless the closed Run Contract says so."
