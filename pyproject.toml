[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-new"
version = "0.1.0"
description = "Web Comic Studio - Single Transactional Authority"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
]

[project.scripts]
comic-new = "comic_new.cli:main"

[tool.setuptools.package-data]
comic_new = ["schema.sql", "migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
