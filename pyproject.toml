[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logtrim"
version = "3.0.0"
description = "Zero-runtime-dependency, bounded-state log pattern analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logtrim = "logtrim.cli:main"

[tool.setuptools.packages.find]
include = ["logtrim*"]